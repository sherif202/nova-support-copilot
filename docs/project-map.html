<style>

:root {

  --sans: "IBM Plex Sans", system-ui, sans-serif; --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #9aa7b6; --line: #3a4653;
  --lin: #b3a0ff; --lin-soft: #2a2247; --on-lin: #15102b;
  --cont: #5cc3c4; --cont-soft: #15383a; --gate: #6fd08a; --warn: #f2c063; --risk: #ff8a80; --risk-soft: #3d1c1a;
  color-scheme: dark; } }
:root[data-theme="dark"] {
  --bg: #0f141a; --surface: #171e26; --ink: #e5eaf0; --muted: #9aa7b6; --line: #3a4653;
  --lin: #b3a0ff; --lin-soft: #2a2247; --on-lin: #15102b;
  --cont: #5cc3c4; --cont-soft: #15383a; --gate: #6fd08a; --warn: #f2c063; --risk: #ff8a80; --risk-soft: #3d1c1a;
  color-scheme: dark; }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; }
.wrap { max-width: 1280px; margin: 0 auto; padding: 24px 16px 32px; display: grid; gap: 14px; }
h1 { margin: 0; font-size: clamp(24px, 3vw, 32px); letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; color: var(--muted); max-width: 75ch; }
figure { margin: 0; display: grid; gap: 10px; min-width: 0; }
.scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 8px; }
svg { display: block; width: 100%; min-width: 980px; height: auto; font-family: var(--sans); }
figcaption { font-size: 13px; color: var(--muted); }
.key { display: inline-block; width: 11px; height: 11px; border-radius: 50%; margin: 0 5px 0 12px; vertical-align: -1px; }
.key:first-child { margin-left: 0; }
a:focus-visible circle { stroke: var(--ink); stroke-width: 3; }
.bx { fill: var(--bg); stroke: var(--line); }
.core { fill: var(--cont-soft); stroke: var(--cont); stroke-width: 2; }
.next { fill: none; stroke: var(--warn); stroke-dasharray: 6 5; stroke-width: 1.5; }
.step { fill: var(--surface); stroke: var(--cont); }
.step.ai { fill: var(--lin); stroke: var(--lin); }
.oc { fill: var(--surface); stroke: var(--cont); }
.oc.pers { stroke: var(--risk); fill: var(--risk-soft); }
.chip { fill: var(--surface); stroke: var(--line); }
.ln { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.ln.ai { stroke: var(--lin); stroke-width: 2; }
.ln.tiny { stroke-width: 1.2; }
.ln.dash { stroke: var(--warn); stroke-dasharray: 5 4; }
.ln.stopl { stroke: var(--risk); }
.track { fill: none; stroke: var(--ink); stroke-width: 6; }
.track.later { stroke: var(--line); stroke-dasharray: 2 9; stroke-linecap: round; }
.stn { stroke: var(--surface); stroke-width: 3; }
.stn.ok { fill: var(--gate); }
.stn.wa { fill: var(--warn); }
.num { fill: var(--surface); font: 600 15px var(--mono); }
.num.sm { font-size: 13px; }
text { fill: var(--ink); }
text.k { fill: var(--muted); font: 500 12px var(--mono); letter-spacing: .05em; }
text.h { font-size: 17px; font-weight: 700; }
text.h2 { font-size: 15px; font-weight: 600; }
text.s { fill: var(--muted); font-size: 14px; }
text.s2 { fill: var(--muted); font-size: 12px; }
text.b { font-size: 15px; }
text.b2 { font-size: 14px; }
text.lb { fill: var(--muted); font-size: 13px; font-style: italic; }
text.st { font-size: 13px; font-weight: 600; }
text.st2 { fill: var(--muted); font-size: 11.5px; }
text.st.ai, text.st2.ai { fill: var(--on-lin); }
text.oc-t, text.chip-t { font-size: 13.5px; }
text.stop { fill: var(--risk); font-size: 14px; font-weight: 700; }
</style></head><body>
